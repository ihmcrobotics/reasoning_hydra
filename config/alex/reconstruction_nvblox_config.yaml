# GPU profile: independent map, local radius, CPU mesh and semantic settings.
# Internal reconstruction: cpu (default), nvblox (experimental GPU fusion), both (comparison).
---
backend: nvblox-cpu
gpu_max_integration_distance_m: 4.0
# Optional CPU GVD on GPU-derived TSDF in both mode; full readback, no graph output.
gpu_validate_gvd: false
map:
  voxels_per_side: 16
  voxel_size: 0.1
  truncation_distance: 0.3
dense_representation_radius_m: 8.0
mesh:
  min_weight: 0.0001
  integrator_threads: -1
tsdf:
  verbosity: 1
  num_threads: -1
  interpolation_method: bilinear
  semantic_integrator:
    type: MLESemanticIntegrator
